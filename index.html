<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch a Sketch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main">
    <div>
      <h1>Etch a Sketch</h1>
      <form action="POST">
        <label for="row-size">
          Row size:
          <input type="number" name="row-size" id="row-size" min="0" max="100" value="0">
        </label>
        <button type="submit" class="set-btn">Set</button>
      </form>
    </div>
    <div class="grid-container">
      <div class="grid-bg">
      </div>
    </div>
  </div>
  <script src="code.js"></script>
</body>
</html>
