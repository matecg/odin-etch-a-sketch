<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch a Sketch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main">
    <h1>Etch a Sketch</h1>
    <div>
      <form>
        <fieldset>
          <legend>Select the number of tiles per row (max. 100):</legend>
          <label for="row-size">
            Row size:
            <input type="number" name="row-size" id="row-size" min="0" max="100" value="0">
          </label>
        </fieldset>
        <fieldset class="draw-mode">
          <legend>Select the drawing mode:</legend>
          <div>
            <input type="radio" name="draw-mode" id="standard" value="standard" checked>
            <label for="standard">Standard</label>
          </div>
          <div>
            <input type="radio" name="draw-mode" id="dimmed" value="dimmed">
            <label for="dimmed">Dimmed</label>
          </div>
          <div>
            <input type="radio" name="draw-mode" id="rainbow" value="rainbow">
            <label for="rainbow">Rainbow</label>
          </div>
        </fieldset>
        <button type="submit" class="set-btn">Set</button>
      </form>
    </div>
    <div class="instructions-container">
      <p>Instructions</p>
      <ul>
        <li><span>🖌️ Draw</span>: Press the Left Mouse Button over a tile and drag;</li>
        <li><span>🗑️ Erase</span>: CTRL + Left Mouse Button over a tile and drag.</li>
      </ul>
    </div>
    <div class="grid-container">
      <div class="grid-bg">
      </div>
    </div>
  </div>
  <script src="code.js"></script>
</body>
</html>
